name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # `next build` includes the full TypeScript check; a standalone tsc
      # before build would fail — Next's generated types (LayoutProps etc.)
      # only exist in .next/types after a build.
      - name: Build (includes type check)
        run: npm run build
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
